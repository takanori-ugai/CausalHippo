# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "yaml_config" ]
  pull_request:
    branches: [ "yaml_config" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Normalize eval/ragas wrapper jar
      run: cp gradle/wrapper/gradle-wrapper.jar eval/ragas/gradle/wrapper/gradle-wrapper.jar

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.4.1 # v4.0.0

    # Generate the report from the full suite before the filtered contract gates rerun the test task.
    - name: Build and generate coverage
      run: ./gradlew build jacocoTestReport

    - name: Unified API Contract Gate
      run: ./gradlew test --tests "shared.rag.unified.*"

    - name: Unified Persistence Contract Gate
      run: >
        ./gradlew test
        --tests "shared.rag.spi.persistence.*"
        --tests "shared.rag.unified.UnifiedPersistence*"

    - name: Unified Persistence Baseline Gate
      run: python3 scripts/check_unified_persistence_baseline.py

    - name: Unified Parity Fixture Gate
      run: >
        python3 scripts/compare_unified_parity.py
        --legacy-dir src/test/resources/unified_parity/legacy
        --unified-dir src/test/resources/unified_parity/unified
        --conditions all
        --max-mean-abs-diff 0.01
        --max-max-abs-diff 0.02
        --max-missing-ratio 0.0
        --min-prediction-match 1.0


    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: build/reports/jacoco/test/jacocoTestReport.xml
        disable_search: true
        fail_ci_if_error: true
